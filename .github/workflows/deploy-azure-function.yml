name: PIAGA-TIEMPO - Deploy Azure Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-azure-function.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Autenticar Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy do código Python da Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP }}
          package: functions
          remote-build: true
          respect-funcignore: true
