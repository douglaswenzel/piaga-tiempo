
name: PIAGA Motors - Extração de Catálogo

on:
  schedule:
    - cron: "0 11 * * *"
      timezone: "America/Sao_Paulo"

    - cron: "30 15 * * *"
      timezone: "America/Sao_Paulo"

    - cron: "0 18 * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: read

# Evita execuções simultâneas alterando o catálogo.
concurrency:
  group: piaga-catalogo-producao
  cancel-in-progress: false

jobs:
  pipeline:
    name: Extrair catálogo e salvar no Neon
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar configuração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CATALOGO_URL: ${{ secrets.CATALOGO_URL }}
          EMAIL: ${{ secrets.CATALOGO_EMAIL }}
          SENHA: ${{ secrets.CATALOGO_SENHA }}
        run: |
          set -eu

          for name in DATABASE_URL CATALOGO_URL EMAIL SENHA; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Secret ausente: $name"
              exit 1
            fi
          done

          echo "Configuração mínima validada."

      - name: Construir imagem Docker
        run: docker build -t piaga-catalogo:latest .

      - name: Executar extração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CATALOGO_URL: ${{ secrets.CATALOGO_URL }}
          EMAIL: ${{ secrets.CATALOGO_EMAIL }}
          SENHA: ${{ secrets.CATALOGO_SENHA }}
          HEADLESS: "true"
          TZ: America/Sao_Paulo
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e CATALOGO_URL \
            -e EMAIL \
            -e SENHA \
            -e HEADLESS \
            -e TZ \
            piaga-catalogo:latest
