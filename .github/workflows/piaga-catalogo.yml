name: PIAGA-TIEMPO - Extracao Neon e Relatorios Azure

on:
  schedule:
    - cron: "0 11 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "30 15 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "0 18 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      azure_test_only:
        description: "Testar somente login OIDC e upload de TXT (sem extrair ou enviar e-mail)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: piaga-catalogo-producao
  cancel-in-progress: false

jobs:
  pipeline:
    name: Extrair e gerar ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
      PIAGA_AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      PIAGA_AZURE_CONTAINER: relatorios
      PIAGA_AZURE_QUEUE: relatorios-prontos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir identidade GitHub
        run: |
          echo "Repositorio: ${GITHUB_REPOSITORY}"
          echo "Branch: ${GITHUB_REF}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Repo ID: ${{ github.repository_id }}"

      - name: Autenticar Azure apenas no teste isolado
        if: ${{ inputs.azure_test_only == true }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Teste isolado de upload no Blob Storage
        if: ${{ inputs.azure_test_only == true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PIAGA-TIEMPO ${GITHUB_RUN_ID}" > teste.txt
          az storage blob upload \
            --account-name "$PIAGA_AZURE_STORAGE_ACCOUNT" \
            --container-name relatorios \
            --name "_testes/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" \
            --file teste.txt \
            --auth-mode login \
            --overwrite false \
            --only-show-errors
          echo 'OIDC e upload de teste concluídos.'

      - name: Conferir segredos do extrator
        if: ${{ inputs.azure_test_only != true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CATALOGO_URL: ${{ secrets.CATALOGO_URL }}
          EMAIL: ${{ secrets.CATALOGO_EMAIL }}
          SENHA: ${{ secrets.CATALOGO_SENHA }}
        shell: bash
        run: |
          set -euo pipefail
          for var in DATABASE_URL CATALOGO_URL EMAIL SENHA; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Secret ausente: $var"
              exit 1
            fi
          done

      - name: Construir imagem Playwright atual (sem alterações)
        if: ${{ inputs.azure_test_only != true }}
        run: docker build -t piaga-catalogo:latest .

      - name: Executar extrator Playwright e gravar no Neon
        if: ${{ inputs.azure_test_only != true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CATALOGO_URL: ${{ secrets.CATALOGO_URL }}
          EMAIL: ${{ secrets.CATALOGO_EMAIL }}
          SENHA: ${{ secrets.CATALOGO_SENHA }}
          HEADLESS: 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --shm-size=1g \
            -e DATABASE_URL -e CATALOGO_URL -e EMAIL -e SENHA \
            -e HEADLESS -e TZ \
            piaga-catalogo:latest

      - name: Instalar Python
        if: ${{ inputs.azure_test_only != true }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias dos relatorios
        if: ${{ inputs.azure_test_only != true }}
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Gerar as planilhas e o ZIP sem publicar
        if: ${{ inputs.azure_test_only != true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_PUBLISH_ENABLED: 'false'
        run: python extrair_fracionado.py

      # Guardar os relatórios ANTES da tentativa de entrega Azure, de modo que
      # uma eventual falha de login/upload não provoque nova coleta do catálogo.
      - name: Preservar ZIP antes de publicar no Azure
        if: ${{ inputs.azure_test_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-piaga-tiempo-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/**/relatorio_completo.zip
          if-no-files-found: error
          retention-days: 7

      - name: Renovar login Azure OIDC apos gerar o ZIP
        if: ${{ inputs.azure_test_only != true && vars.AZURE_PUBLISH_ENABLED == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Reutiliza o publicador comprovado pelo workflow de recuperacao.
      - name: Publicar ZIP pronto no Blob e notificar a fila
        if: ${{ inputs.azure_test_only != true && vars.AZURE_PUBLISH_ENABLED == 'true' }}
        env:
          PIAGA_ORIGEM: 'neon'
        shell: bash
        run: |
          set -euo pipefail
          test -f publicar_relatorio_salvo.py || { echo '::error::publicar_relatorio_salvo.py ausente na raiz'; exit 1; }
          python publicar_relatorio_salvo.py
