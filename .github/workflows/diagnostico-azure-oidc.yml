name: PIAGA-TIEMPO - Diagnostico OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Exibir somente subject e dados nao secretos
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")
          export RESPONSE
          python3 - <<'PY'
          import os, json, base64
          token = json.loads(os.environ['RESPONSE'])['value']
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print('githubSubject =', claims['sub'])
          print('repository_id =', claims.get('repository_id'))
          print('repository_owner_id =', claims.get('repository_owner_id'))
          # Nunca imprime JWT nem credenciais.
          PY
