services:
  catalogo:
    build: .
    image: catalogo-scraper:latest
    container_name: catalogo-scraper
    env_file:
      - .env                 # contém EMAIL, SENHA, CATALOGO_URL
    environment:
      HEADLESS: "true"
      DB_PATH: /app/data/catalogo.db
    volumes:
      - ./data:/app/data     # ← SQLite persiste aqui
    # Se quiser ver o browser "de verdade" (opção B), descomente:
    # command: xvfb-run -a --server-args="-screen 0 1920x1080x24" tsx src/index.ts
    restart: "no"